<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Carousel</title>
</head>

<body>
    <div id="mediaCarouselConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-select,emby-checkbox,emby-textarea">
        <div data-role="content">
            <div class="content-primary">

                <style>
                    /* Même famille que les pages de NotifySync et de XFusion : en-tête en carte,
                       sommaire « Aller à », bloc d'état en grille, panneaux titrés d'une icône, barre
                       d'enregistrement flottante. Les gris sont des rgba(128,128,128,α) pour rester
                       lisibles sur les thèmes clairs comme sombres ; seules les couleurs de sens
                       (accent, succès, alerte) sont fixes. Aucune classe de Jellyfin n'est surchargée. */
                    #mediaCarouselConfigPage {
                        --mc-accent: #00a4dc;
                        --mc-ok: #52b54b;
                        --mc-warn: #e6a817;
                        --mc-line: rgba(128, 128, 128, .34);
                        --mc-line-soft: rgba(128, 128, 128, .2);
                        --mc-surface: rgba(128, 128, 128, .08);
                        --mc-surface-strong: rgba(128, 128, 128, .16);
                        --mc-radius: 10px;
                    }
                    #mediaCarouselConfigPage .mcCfg-root { max-width: 980px; margin: 0 auto; padding-bottom: 90px; }
                    #mediaCarouselConfigPage .mcCfg-root form { max-width: none; width: 100%; }

                    /* En-tête : la carte de NotifySync. */
                    .mcCfg-head { display: flex; align-items: center; gap: 16px; margin: 18px 0 14px;
                        padding: 18px 22px; border: 1px solid var(--mc-line-soft); border-radius: var(--mc-radius);
                        background: linear-gradient(135deg, rgba(0, 164, 220, .16), rgba(0, 164, 220, .03)); }
                    .mcCfg-head-icon { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%;
                        display: flex; align-items: center; justify-content: center; font-size: 28px;
                        background: rgba(0, 164, 220, .16); }
                    .mcCfg-head-text { min-width: 0; }
                    .mcCfg-head h1 { margin: 0; font-size: 1.5em; line-height: 1.2; }
                    .mcCfg-version { display: inline-block; margin-left: .5em; padding: 2px 9px; border-radius: 999px;
                        font-size: .5em; font-weight: 600; vertical-align: middle; background: var(--mc-surface-strong); opacity: .8; }
                    .mcCfg-version:empty { display: none; }
                    .mcCfg-intro { margin: .3em 0 0; opacity: .75; max-width: 62ch; font-size: .92em; }

                    /* Interrupteur « Aide » : comme « Descriptions » de Jellyfin Enhanced, il masque
                       toutes les phrases d'explication pour qui connaît déjà la page. */
                    .mcCfg-head-tools { margin-left: auto; flex: 0 0 auto; }
                    .mcCfg-toggle { display: inline-flex; align-items: center; gap: .5em; padding: 6px 8px 6px 12px;
                        border-radius: 999px; border: 1px solid var(--mc-line); background: var(--mc-surface);
                        color: inherit; font: inherit; font-size: .85em; cursor: pointer; }
                    .mcCfg-toggle-state { font-size: .78em; font-weight: 700; padding: 2px 8px; border-radius: 999px;
                        background: var(--mc-surface-strong); }
                    .mcCfg-toggle[aria-pressed="true"] .mcCfg-toggle-state { background: var(--mc-accent); color: #fff; }
                    #mediaCarouselConfigPage.mcCfg-nohints .fieldDescription:not(#seerrTestResult),
                    #mediaCarouselConfigPage.mcCfg-nohints .mcCfg-group-hint,
                    #mediaCarouselConfigPage.mcCfg-nohints .mcCfg-intro { display: none; }

                    /* Sommaire « Aller à » : celui de XFusion, des pastilles qui passent à la ligne. */
                    .mcCfg-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 16px;
                        padding: 8px 12px; border: 1px solid var(--mc-line-soft); border-radius: var(--mc-radius);
                        background: var(--mc-surface); }
                    .mcCfg-nav-title { font-size: .68em; letter-spacing: .1em; text-transform: uppercase; opacity: .55; margin-right: 6px; }
                    .mcCfg-nav-link { padding: 5px 11px; border: 1px solid transparent; border-radius: 999px; background: transparent;
                        color: inherit; font: inherit; font-size: .9em; cursor: pointer; opacity: .78; }
                    .mcCfg-nav-link:hover { background: var(--mc-surface-strong); opacity: 1; }
                    .mcCfg-nav-link.is-active { border-color: var(--mc-accent); color: var(--mc-accent); opacity: 1; font-weight: 600; }

                    /* Bloc d'état : le calcul en tête, les chiffres en grille, les services en pied. */
                    .mcCfg-statusbox { margin: 0 0 18px; border: 1px solid var(--mc-line); border-radius: var(--mc-radius); overflow: hidden; }
                    .mcCfg-run { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
                        padding: 14px 16px; background: var(--mc-surface-strong); }
                    .mcCfg-run[data-state="warn"] { background: rgba(230, 168, 23, .14); }
                    .mcCfg-run-text { flex: 1 1 260px; min-width: 0; }
                    .mcCfg-caption { font-size: .68em; letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-bottom: 3px; }
                    .mcCfg-run-value { font-size: 1.18em; font-weight: 600; display: flex; align-items: center; gap: .45em; }
                    .mcCfg-run[data-state="ok"] .mcCfg-run-value { color: var(--mc-ok); }
                    .mcCfg-run[data-state="warn"] .mcCfg-run-value { color: var(--mc-warn); }
                    .mcCfg-run-detail { font-size: .82em; opacity: .7; overflow-wrap: anywhere; }
                    .mcCfg-run .raised { margin: 0; width: auto; flex: 0 0 auto; }

                    .mcCfg-status { display: grid; gap: 1px; background: var(--mc-line-soft);
                        grid-template-columns: repeat(4, minmax(0, 1fr)); }
                    @media (max-width: 760px) { .mcCfg-status { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
                    /* Chaque chiffre mène à son réglage d'un clic, comme les cartes de Jellyfin Enhanced. */
                    .mcCfg-tile { display: block; width: 100%; text-align: left; border: 0; margin: 0; color: inherit; font: inherit;
                        padding: 12px 16px; background: var(--mc-surface); min-width: 0; cursor: pointer; }
                    .mcCfg-tile:hover { background: var(--mc-surface-strong); }
                    .mcCfg-tile > span { display: block; }
                    button.mcCfg-chip { background: transparent; color: inherit; font: inherit; font-size: .8em; cursor: pointer; }
                    button.mcCfg-chip:hover { background: var(--mc-surface-strong); }
                    .mcCfg-tile-name { font-size: .68em; letter-spacing: .08em; text-transform: uppercase; opacity: .6;
                        display: flex; align-items: center; gap: .45em; }
                    .mcCfg-tile-dot { width: .7em; height: .7em; border-radius: 50%; flex: 0 0 auto; background: currentColor; opacity: .35; }
                    [data-state="ok"] > .mcCfg-tile-name .mcCfg-tile-dot { opacity: 1; color: var(--mc-ok); }
                    [data-state="warn"] > .mcCfg-tile-name .mcCfg-tile-dot { opacity: 1; color: var(--mc-warn); }
                    .mcCfg-tile-value { font-size: 1.8em; font-weight: 700; line-height: 1.2; margin-top: .1em;
                        font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
                    .mcCfg-tile[data-state="ok"] .mcCfg-tile-value { color: var(--mc-accent); }
                    .mcCfg-tile[data-state="off"] .mcCfg-tile-value { opacity: .45; }
                    .mcCfg-tile-detail { font-size: .78em; opacity: .7; }

                    .mcCfg-health { display: flex; flex-wrap: wrap; gap: .45em; list-style: none; margin: 0; padding: 10px 16px;
                        border-top: 1px solid var(--mc-line-soft); }
                    .mcCfg-chip { display: inline-flex; align-items: center; gap: .4em; font-size: .8em;
                        padding: .25em .7em; border-radius: 999px; border: 1px solid var(--mc-line-soft); }
                    .mcCfg-chip-mark { font-weight: 700; }
                    .mcCfg-chip[data-state="ok"] .mcCfg-chip-mark { color: var(--mc-ok); }
                    .mcCfg-chip[data-state="warn"] { border-color: var(--mc-warn); }
                    .mcCfg-chip[data-state="warn"] .mcCfg-chip-mark { color: var(--mc-warn); }
                    .mcCfg-chip[data-state="off"] { opacity: .65; }
                    .mcCfg-chip-detail { opacity: .75; }

                    /* Panneaux : une section, un titre précédé de son icône. */
                    .mcCfg-group, .mcCfg-advanced { border: 1px solid var(--mc-line-soft); border-radius: var(--mc-radius);
                        background: var(--mc-surface); padding: 16px 20px 8px; margin: 0 0 18px; min-width: 0;
                        scroll-margin-top: 5em; }
                    .mcCfg-group > legend { float: left; width: 100%; padding: 0; margin: 0 0 6px;
                        font-size: 1.18em; font-weight: 600; display: flex; align-items: center; gap: .55em; }
                    .mcCfg-group > legend + * { clear: both; }
                    .mcCfg-group > legend[data-icon]::before, .mcCfg-advanced > summary[data-icon]::before {
                        content: attr(data-icon); margin-right: .1em; }
                    .mcCfg-count { font-size: .68em; font-weight: 600; padding: .15em .65em; border-radius: 999px;
                        color: var(--mc-accent); background: rgba(0, 164, 220, .14); }
                    .mcCfg-count:empty { display: none; }
                    .mcCfg-group-hint { margin: 0 0 14px; opacity: .7; max-width: 62ch; font-size: .9em; line-height: 1.45; }
                    .mcCfg-group .inputContainer, .mcCfg-group .selectContainer, .mcCfg-group .checkboxContainer,
                    .mcCfg-advanced .inputContainer, .mcCfg-advanced .selectContainer, .mcCfg-advanced .checkboxContainer { margin-bottom: 1.1em; }

                    .mcCfg-section-state { font-size: .8em; opacity: .65; margin: -.6em 0 1em; }
                    .mcCfg-section-state:empty { display: none; }

                    /* auto-fill et non auto-fit : un champ seul garde la largeur d'une colonne au lieu
                       de s'étirer sur toute la carte. Quatre champs tiennent sur une ligne quand il y a
                       la place, sinon deux par deux : jamais un dernier champ seul sur sa ligne. */
                    .mcCfg-grid { display: grid; gap: 0 1.4em; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
                    .mcCfg-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
                    @media (min-width: 1100px) { .mcCfg-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
                    @media (max-width: 520px) { .mcCfg-grid-4 { grid-template-columns: minmax(0, 1fr); } }
                    /* Une pastille de couleur, pas une barre sur toute la largeur. */
                    #mediaCarouselConfigPage #HighlightColor { max-width: 6em; height: 2.4em; padding: 2px; cursor: pointer; }

                    .mcCfg-sub { margin-top: .4em; padding-top: 1em; border-top: 1px solid var(--mc-line-soft); }
                    .mcCfg-sub-title { font-size: .95em; font-weight: 600; margin: 0 0 .5em; }

                    /* Liste des rangées : des lignes fines, les flèches discrètes au bout. */
                    .mcCfg-order { list-style: none; margin: .4em 0 0; padding: 0; }
                    .mcCfg-order li { display: flex; align-items: center; gap: .6em; padding: .15em .5em .15em .7em;
                        margin-bottom: 4px; border-radius: 8px; border: 1px solid var(--mc-line-soft); background: var(--mc-surface); }
                    .mcCfg-order-rank { font-size: .78em; opacity: .5; min-width: 1.3em; font-variant-numeric: tabular-nums; }
                    .mcCfg-order-name { flex: 1; }
                    .mcCfg-order .emby-checkbox-label { flex: 1; margin: 0; min-width: 0; }
                    .mcCfg-order-native { opacity: .75; padding: .55em 0; }
                    /* jellyfin-web met ses boutons en flex sans centrage horizontal : la flèche
                       se collait au bord gauche de sa case. */
                    #mediaCarouselConfigPage .mcCfg-order button { display: inline-flex; align-items: center; justify-content: center;
                        min-width: 0; width: 2.2em; height: 2.2em; padding: 0; margin: 0;
                        font-size: .8em; border-radius: 6px; background: transparent; border: 1px solid var(--mc-line-soft); }
                    #mediaCarouselConfigPage .mcCfg-order button[disabled] { opacity: .25; }

                    .mcCfg-alert { display: flex; gap: .6em; align-items: flex-start; font-size: .9em;
                        border: 1px solid var(--mc-warn); border-left-width: 4px; border-radius: 8px;
                        padding: .75em 1em; margin: 0 0 18px; background: rgba(230, 168, 23, .1); }
                    .mcCfg-alert strong { display: block; margin-bottom: .15em; }

                    /* Choix des comptes : réglages du serveur = point de départ. */
                    .mcCfg-note { margin: 0 0 1.1em; padding: .8em 1em; border-radius: 8px; border-left: 3px solid var(--mc-accent);
                        background: rgba(0, 164, 220, .08); font-size: .9em; }
                    .mcCfg-note p { margin: 0 0 .7em; }
                    #mediaCarouselConfigPage .mcCfg-note button { margin: 0; width: auto; }
                    .mcCfg-note-result { margin: .6em 0 0 !important; opacity: .8; }
                    .mcCfg-note-result:empty { display: none; }

                    /* Comptes et bibliothèques à exclure : des cases, plus des identifiants à taper. */
                    .mcCfg-picks { display: grid; gap: 0 1.2em; margin: .2em 0 .3em;
                        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
                    .mcCfg-picks .emby-checkbox-label { margin: 0; }

                    .mcCfg-advanced > summary { cursor: pointer; font-weight: 600; font-size: 1.18em; padding-bottom: 8px; }
                    .mcCfg-advanced[open] > summary { margin-bottom: 4px; }

                    /* Barre d'enregistrement : celle de XFusion, montrée seulement quand un réglage
                       attend d'être enregistré. Fixe, pour ne rien décaler en apparaissant. */
                    .mcCfg-savebar { position: fixed; left: 50%; bottom: 1.4rem; z-index: 120; display: flex; gap: 18px;
                        align-items: center; max-width: calc(100vw - 2rem); padding: 10px 12px 10px 18px;
                        border: 1px solid var(--mc-warn); border-radius: 999px; background: rgba(128, 128, 128, .26);
                        backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
                        box-shadow: 0 6px 24px rgba(0, 0, 0, .4);
                        transform: translateX(-50%) translateY(180%); opacity: 0; pointer-events: none;
                        transition: transform .22s ease, opacity .22s ease; }
                    .mcCfg-savebar.is-visible { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
                    .mcCfg-savebar-state { display: flex; align-items: center; gap: 9px; font-size: .9em; font-weight: 600;
                        color: var(--mc-warn); white-space: nowrap; }
                    .mcCfg-savebar-state::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--mc-warn); }
                    #mediaCarouselConfigPage .mcCfg-savebar button { margin: 0; width: auto; min-width: 150px; border-radius: 999px; }
                    @media (max-width: 480px) { .mcCfg-savebar-state span { display: none; } }

                    .mcCfg-feedback { margin: 0 0 18px; padding: .8em 1em; border-radius: 8px;
                        border: 1px solid var(--mc-line-soft); background: var(--mc-surface); }
                    .mcCfg-feedback:empty { display: none; }

                    /* `hidden` doit l'emporter partout : une grille, une case à cocher de
                       jellyfin-web ou une alerte reçoivent un `display` qui primerait sinon. */
                    #mediaCarouselConfigPage [hidden] { display: none !important; }

                    /* Le contour de focus ne doit jamais dépendre du thème actif. */
                    #mediaCarouselConfigPage :focus-visible { outline: 3px solid currentColor;
                        outline-offset: 2px; border-radius: 3px; }

                    /* jellyfin-web 12.1 met `.checkboxContainer` en ligne et fixe la hauteur du
                       libellé (2,35em) en le centrant : la case et son explication se partageaient
                       la largeur, et sur un téléphone le libellé, serré sur six lignes, débordait
                       sur le texte du dessus. L'explication passe dessous — ce que fait
                       `checkboxContainer-withDescription` chez Jellyfin — et le libellé grandit
                       avec son texte. */
                    #mediaCarouselConfigPage div.checkboxContainer { flex-direction: column; }
                    #mediaCarouselConfigPage .emby-checkbox-label { height: auto; min-height: 2.35em; }

                    @media (max-width: 480px) {
                        .mcCfg-head { padding: 14px; gap: 12px; }
                        .mcCfg-head-icon { width: 44px; height: 44px; font-size: 22px; }
                        .mcCfg-group, .mcCfg-advanced { padding: 14px 12px 6px; }
                        .mcCfg-tile-value { font-size: 1.45em; }
                    }

                    @media (prefers-reduced-motion: reduce) {
                        #mediaCarouselConfigPage * { transition: none !important; }
                        .mcCfg-savebar { transform: translateX(-50%) translateY(0); }
                    }
                </style>

                <!-- Les textes viennent des tables `strings` du script, en français ou en
                     anglais selon la langue d'affichage du compte : un élément porteur de
                     `data-i18n` reçoit son texte, `data-i18n-label` le libellé d'un champ. -->
                <div class="mcCfg-root">
                <div class="mcCfg-head">
                    <div class="mcCfg-head-icon" aria-hidden="true">🎬</div>
                    <div class="mcCfg-head-text">
                        <h1>Media Carousel<span class="mcCfg-version" id="mcVersion"></span></h1>
                        <p class="mcCfg-intro" data-i18n="intro"></p>
                    </div>
                    <div class="mcCfg-head-tools">
                        <button type="button" class="mcCfg-toggle" id="mcHintsToggle" aria-pressed="true">
                            <span data-i18n="hintsLabel"></span><span class="mcCfg-toggle-state" id="mcHintsState"></span>
                        </button>
                    </div>
                </div>

                <!-- Sommaire construit par `buildNav` à partir des `data-nav` des panneaux. -->
                <nav class="mcCfg-nav" id="mcNav" data-i18n-aria="navLabel">
                    <span class="mcCfg-nav-title" data-i18n="navTitle"></span>
                </nav>

                <div class="mcCfg-statusbox">
                    <div class="mcCfg-run" id="mcRun" data-state="pending">
                        <div class="mcCfg-run-text">
                            <div class="mcCfg-caption" data-i18n="runCaption"></div>
                            <div class="mcCfg-run-value" id="mcRunValue"></div>
                            <div class="mcCfg-run-detail" id="mcRunDetail"></div>
                        </div>
                        <button is="emby-button" type="button" id="refreshNowButton" class="raised button-submit">
                            <span data-i18n="refreshNow"></span>
                        </button>
                    </div>

                    <!-- Pas de zone `aria-live` : les chiffres se redessinent à chaque frappe dans
                         une clé ou un nombre, un lecteur d'écran les relirait tous à chaque touche. -->
                    <div class="mcCfg-status" id="mcStatus" role="group" data-i18n-aria="statusLabel"></div>

                    <ul class="mcCfg-health" id="mcHealth" data-i18n-aria="healthLabel"></ul>
                </div>

                <p class="mcCfg-feedback" id="mcFeedback" role="status" aria-live="polite"></p>

                <p class="mcCfg-alert" id="mcDuplicateAlert" role="status" aria-live="polite" hidden></p>

                <!-- Un bloc porteur de `data-show-if` n'apparaît que si sa condition tient :
                     voir `applyVisibility`. Les identifiants des champs sont ceux de la
                     configuration ; le script ne connaît qu'eux. -->
                <form id="mediaCarouselConfigForm">

                    <fieldset class="mcCfg-group" id="blockRows" data-nav="navRows">
                        <legend data-icon="📺"><span data-i18n="legendRows"></span><span class="mcCfg-count" id="mcActiveRows"></span></legend>

                        <!-- L'interrupteur général n'est plus proposé (2026-10-25) : les cases des
                             rangées en tiennent lieu. Il reste chargé et enregistré ; un serveur qui
                             l'avait coupé le voit annoncé ici, avec de quoi le rallumer. -->
                        <input type="checkbox" id="EnableHomeRows" hidden />
                        <div class="mcCfg-alert" id="mcRowsOff" data-show-if="!EnableHomeRows">
                            <span aria-hidden="true">&#9888;</span><span>
                                <strong data-i18n="rowsOffTitle"></strong>
                                <span data-i18n="rowsOffText"></span>
                                <button is="emby-button" type="button" class="raised button-alt" id="mcRowsOn">
                                    <span data-i18n="rowsOn"></span>
                                </button>
                            </span>
                        </div>

                        <div class="inputContainer">
                            <span class="inputLabel" id="labelRowOrder" data-i18n="rowOrder"></span>
                            <!-- La liste écrit son ordre dans ce champ, que les tableaux de
                                 chargement et de sauvegarde connaissent. Chaque rangée du plugin
                                 porte sa case ; les sections de Jellyfin, ajoutées par le script,
                                 n'en ont pas. -->
                            <input type="hidden" id="RowOrder" />
                            <ol class="mcCfg-order" id="mcRowOrder" aria-labelledby="labelRowOrder"
                                aria-describedby="hintRowOrder">
                                <li data-row="local">
                                    <span class="mcCfg-order-rank"></span>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="EnableLocalTop" />
                                        <span class="mcCfg-order-name" data-i18n="rowLocal"></span>
                                    </label>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-up">&#9650;</button>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-down">&#9660;</button>
                                </li>
                                <li data-row="alltime">
                                    <span class="mcCfg-order-rank"></span>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="EnableAllTimeRow" />
                                        <span class="mcCfg-order-name" data-i18n="rowAllTime"></span>
                                    </label>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-up">&#9650;</button>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-down">&#9660;</button>
                                </li>
                                <li data-row="global">
                                    <span class="mcCfg-order-rank"></span>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="EnableGlobalTop" />
                                        <span class="mcCfg-order-name" data-i18n="rowGlobal"></span>
                                    </label>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-up">&#9650;</button>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-down">&#9660;</button>
                                </li>
                                <li data-row="returning">
                                    <span class="mcCfg-order-rank"></span>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="EnableReturningRow" />
                                        <span class="mcCfg-order-name" data-i18n="rowReturning"></span>
                                    </label>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-up">&#9650;</button>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-down">&#9660;</button>
                                </li>
                                <li data-row="neverplayed">
                                    <span class="mcCfg-order-rank"></span>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="EnableNeverPlayedRow" />
                                        <span class="mcCfg-order-name" data-i18n="rowNeverPlayed"></span>
                                    </label>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-up">&#9650;</button>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-down">&#9660;</button>
                                </li>
                                <li data-row="because">
                                    <span class="mcCfg-order-rank"></span>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="EnableBecauseRow" />
                                        <span class="mcCfg-order-name" data-i18n="rowBecause"></span>
                                    </label>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-up">&#9650;</button>
                                    <button is="emby-button" type="button" class="raised mcCfg-order-down">&#9660;</button>
                                </li>
                                <li data-row="studios">
                                    <span class="mcCfg-order-rank"></span>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="EnableStudioRow" />
