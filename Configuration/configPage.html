                /* La langue d'affichage choisie dans Jellyfin, comme NotifySync ; à défaut
                   celle du navigateur. Le français pour « fr-* », l'anglais sinon. */
                function detectLanguage() {
                    var wanted = navigator.language || 'en';
                    try {
                        var userId = ApiClient.getCurrentUserId();
                        if (userId) {
                            wanted = localStorage.getItem(userId + '-language') || wanted;
                        }
                    } catch (e) { /* la langue du navigateur reste */ }
                    return /^fr/i.test(wanted) ? 'fr' : 'en';
                }

                var lang = detectLanguage();
                var T = strings[lang];

                function t(key, values) {
                    var text = T[key] == null ? key : String(T[key]);
                    return text.replace(/\{(\w+)\}/g, function (all, name) {
                        return values && values[name] != null ? values[name] : all;
                    });
                }

                function plural(n, one, many) {
                    return n + ' ' + t(n === 1 ? one : many);
                }

                function locale() {
                    return lang === 'fr' ? 'fr-FR' : 'en-US';
                }

                /* jellyfin-web lit l'attribut `label` une fois, à la création du champ, et
                   en tire un `<label for>` voisin : on remplit les deux. */
                function applyTranslations() {
                    page.setAttribute('lang', lang);

                    page.querySelectorAll('[data-i18n]').forEach(function (el) {
                        el.textContent = t(el.getAttribute('data-i18n'));
                    });

                    page.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
                        el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
                    });

                    page.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
                        el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
                    });

                    page.querySelectorAll('[data-i18n-label]').forEach(function (el) {
                        var text = t(el.getAttribute('data-i18n-label'));
                        el.setAttribute('label', text);
                        var labels = el.parentNode.querySelectorAll('label');
                        for (var i = 0; i < labels.length; i++) {
                            if (labels[i].htmlFor === el.id) {
                                labels[i].textContent = text;
                            }
                        }
                    });

                    labelRowButtons();
                }

                function rowName(li) {
                    var id = li.getAttribute('data-row');
                    return id.indexOf('native:') === 0 ? T.native[id] : li.querySelector('.mcCfg-order-name').textContent;
                }

                function labelRowButtons() {
                    Array.prototype.forEach.call(page.querySelectorAll('#mcRowOrder li'), function (li) {
                        var name = rowName(li);
                        li.querySelector('.mcCfg-order-up').setAttribute('aria-label', t('moveUp', { name: name }));
                        li.querySelector('.mcCfg-order-down').setAttribute('aria-label', t('moveDown', { name: name }));
                        var native = li.querySelector('.mcCfg-order-native');
                        if (native) {
                            native.textContent = name;
                        }
                    });
                }

                applyTranslations();

                /* Couples rangée / collection susceptibles de faire doublon sur l'accueil. */
                var duplicatePairs = [
                    { rows: function () { return ['LocalRowTitle']; },
                      collection: 'LocalCollectionName', enable: 'EnableLocalTop', label: 'legendLocal' },
                    // Films et séries séparés, ce sont leurs deux titres que l'accueil affiche.
                    { rows: function () {
                        return field('GlobalTopSplitByType').checked && field('GlobalTopMediaKind').value === 'Both'
                            ? ['GlobalMoviesRowTitle', 'GlobalSeriesRowTitle'] : ['GlobalRowTitle'];
                    }, collection: 'GlobalCollectionName', enable: 'EnableGlobalTop', label: 'legendGlobal' }
                ];

                var status = null;
                var wired = false;

                function field(id) {
                    return page.querySelector('#' + id);
                }

                function toList(value) {
                    return (value || '')
                        .split(/[\s,;]+/)
                        .map(function (entry) { return entry.trim(); })
                        .filter(function (entry) { return entry.length > 0; });
                }

                function escapeHtml(value) {
                    return String(value == null ? '' : value)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }

                function say(message) {
                    field('mcFeedback').textContent = message || '';
                }

                /* Une date absolue déborde ; l'écart au présent se lit d'un coup d'œil, la
                   date exacte reste en légende. Sert au dernier calcul comme au prochain. */
                function relativeDate(value) {
                    var date = new Date(value);
                    if (isNaN(date.getTime())) {
                        return null;
                    }

                    var minutes = Math.round((Date.now() - date.getTime()) / 60000);
                    var future = minutes < 0;
                    var size = Math.abs(minutes);

                    if (size < 1) {
                        return future ? t('soon') : t('justNow');
                    }

                    var amount = size < 60 ? { n: size, unit: t('unitMin') }
                        : size < 1440 ? { n: Math.round(size / 60), unit: t('unitHour') }
                            : { n: Math.round(size / 1440), unit: t('unitDay') };

                    return t(future ? 'inTime' : 'ago', amount);
                }

                var providerLabels = { Tmdb: 'TMDB', Trakt: 'Trakt' };

                function providerName() {
                    var provider = field('GlobalTopProvider').value;
                    return providerLabels[provider] || provider;
                }

                function formatDate(value) {
                    if (!value) {
                        return null;
                    }
                    var date = new Date(value);
                    return isNaN(date.getTime()) ? null : date.toLocaleString(locale());
                }

                /* Un champ couleur n'accepte que « #rrggbb ». Le serveur admet aussi « #rgb » et les
                   formes avec opacité : chargées telles quelles, elles s'affichaient en noir, et un
                   simple « Enregistrer » enregistrait ce noir. */
                function colorForInput(value) {
                    var hex = String(value || '').trim();

                    if (/^#[0-9a-f]{3,4}$/i.test(hex)) {
                        return '#' + hex.charAt(1) + hex.charAt(1) + hex.charAt(2) + hex.charAt(2)
                            + hex.charAt(3) + hex.charAt(3);
                    }
                    if (/^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(hex)) {
                        return hex.substring(0, 7);
                    }

                    return '#775bf4';
                }

                // ----------------------------------------------------------
                // Sommaire et barre d'enregistrement
                // ----------------------------------------------------------

                /* Une pastille par panneau visible, comme le sommaire de XFusion. Des boutons et
                   non des liens « #… » : Jellyfin route sur le fragment, un ancrage ferait quitter
                   la page. Refait à chaque changement : un panneau masqué n'y figure pas. */
                function buildNav() {
                    var nav = field('mcNav');
                    Array.prototype.slice.call(nav.querySelectorAll('.mcCfg-nav-link')).forEach(function (link) {
                        nav.removeChild(link);
                    });

                    Array.prototype.forEach.call(page.querySelectorAll('[data-nav]'), function (panel) {
                        if (panel.hidden) {
                            return;
                        }
                        var link = document.createElement('button');
                        link.type = 'button';
                        link.className = 'mcCfg-nav-link';
                        link.textContent = t(panel.getAttribute('data-nav'));
                        link.addEventListener('click', function () {
                            Array.prototype.forEach.call(nav.querySelectorAll('.mcCfg-nav-link'), function (other) {
                                other.classList.toggle('is-active', other === link);
                            });
                            if (panel.tagName === 'DETAILS') {
                                panel.open = true;
                            }
                            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        });
                        nav.appendChild(link);
                    });
                }

                /* Va au réglage : ouvre le pli s'il le faut, le fait défiler et y pose le focus. Un
                   réglage masqué — son panneau éteint — renvoie à la case de sa rangée, dans la liste. */
                var hiddenFallback = {
                    LocalTopWindowDays: 'EnableLocalTop', GlobalTopApiKey: 'EnableGlobalTop',
                    EnableSeerrRequests: 'EnableGlobalTop'
                };

                function goTo(id) {
                    var target = field(id);
                    if (target && target.closest('[hidden]') && hiddenFallback[id]) {
                        target = field(hiddenFallback[id]);
                    }
                    if (!target) {
                        return;
                    }
                    var fold = target.closest('details');
                    if (fold) {
                        fold.open = true;
                    }
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.focus({ preventScroll: true });
                }

                function wireShortcuts() {
                    ['mcStatus', 'mcHealth'].forEach(function (id) {
                        field(id).addEventListener('click', function (event) {
                            var source = event.target.closest('[data-go]');
                            if (source) {
                                goTo(source.getAttribute('data-go'));
                            }
                        });
                    });
                }

                /* Aide affichée ou non : une commodité de lecture, propre à ce navigateur. */
                var hintsKey = 'mediacarousel-config-hints';

                function applyHints(shownHints) {
                    page.classList.toggle('mcCfg-nohints', !shownHints);
                    field('mcHintsToggle').setAttribute('aria-pressed', shownHints ? 'true' : 'false');
                    field('mcHintsState').textContent = t(shownHints ? 'hintsOn' : 'hintsOff');
                }

                function hintsShown() {
                    try {
                        return localStorage.getItem(hintsKey) !== 'off';
                    } catch (e) {
                        return true;
                    }
                }

                function wireHints() {
                    field('mcHintsToggle').addEventListener('click', function () {
                        var next = page.classList.contains('mcCfg-nohints');
                        try {
                            localStorage.setItem(hintsKey, next ? 'on' : 'off');
                        } catch (e) { /* le choix tient jusqu'au rechargement */ }
                        applyHints(next);
                    });
                }

                /* Choix des comptes : combien en ont, et l'effacement pour tous, en deux temps. */
                var resetArmed = false;

                function renderPrefsNote() {
                    var count = (status && status.CustomizedAccounts) || 0;
                    field('mcPrefsInfo').textContent = t('prefsInfo', { n: count });
                    field('mcResetAllLabel').textContent = resetArmed
                        ? t('resetAllConfirm', { n: count }) : t('resetAll');
                    // Caché plutôt que désactivé : `applyVisibility` réactive les boutons des blocs
                    // visibles, et un bouton qui n'efface rien n'a pas à être proposé.
                    field('mcResetAll').hidden = count === 0;
                }

                function wireResetAll() {
                    field('mcResetAll').addEventListener('click', function () {
                        if (!resetArmed) {
                            resetArmed = true;
                            renderPrefsNote();
                            return;
                        }

                        resetArmed = false;
                        ApiClient.ajax({
                            type: 'DELETE',
                            url: ApiClient.getUrl('MediaCarousel/UserPreferences/All'),
                            dataType: 'json'
                        }).then(function (count) {
                            field('mcResetAllResult').textContent = t('resetAllDone', { n: count || 0 });
                            loadStatus();
                        }, function () {
                            field('mcResetAllResult').textContent = t('resetAllFailed');
                            renderPrefsNote();
                        });
                    });
                }

                var dirty = false;

                /* Centre la barre sur la colonne de la page : centrée sur la fenêtre, le menu
                   latéral de Jellyfin la décalait d'une demi-largeur de menu. */
                function placeSaveBar() {
                    var column = page.querySelector('.mcCfg-root').getBoundingClientRect();
                    if (column.width > 0) {
                        field('mcSaveBar').style.left = Math.round(column.left + column.width / 2) + 'px';
                    }
                }

                function setDirty(value) {
                    dirty = value;
                    if (dirty) {
                        placeSaveBar();
                    }
                    field('mcSaveBar').classList.toggle('is-visible', dirty);
                    field('mcSaveBar').setAttribute('aria-hidden', dirty ? 'false' : 'true');
                    field('mcSaveButton').tabIndex = dirty ? 0 : -1;
                }

                // ----------------------------------------------------------
                // Exclusions à cocher
                // ----------------------------------------------------------

                function sameId(value) {
                    return String(value || '').toLowerCase().replace(/[^0-9a-f]/g, '');
                }

                /* Coche les comptes ou bibliothèques déjà exclus ; un identifiant qui ne
                   correspond plus à rien reste coché, nommé comme tel, pour qu'on puisse le retirer. */
                function renderPicks(listId, rawId, fieldId, entries) {
                    var chosen = toList(field(fieldId).value);
                    var known = entries.map(function (entry) { return sameId(entry.id); });
                    var all = entries.concat(chosen.filter(function (id) {
                        return known.indexOf(sameId(id)) === -1;
                    }).map(function (id) {
                        return { id: id, name: t('unknownId', { id: id }) };
                    }));

                    field(listId).innerHTML = all.map(function (entry) {
                        var checked = chosen.some(function (id) { return sameId(id) === sameId(entry.id); });
                        return '<label class="emby-checkbox-label">'
                            + '<input is="emby-checkbox" type="checkbox" data-pick="' + escapeHtml(entry.id) + '"'
                            + (checked ? ' checked' : '') + ' />'
                            + '<span>' + escapeHtml(entry.name) + '</span></label>';
                    }).join('');

                    field(listId).hidden = false;
                    field(rawId).hidden = true;
                }

                function showRaw(listId, rawId) {
                    field(listId).hidden = true;
                    field(rawId).hidden = false;
                }

                function loadPicks() {
                    var sources = [
                        { list: 'mcPickUsers', raw: 'mcRawUsers', target: 'ExcludedUserIds', route: 'Users',
                          read: function (users) {
                              return users.map(function (u) { return { id: u.Id, name: u.Name }; });
                          } },
                        { list: 'mcPickLibraries', raw: 'mcRawLibraries', target: 'ExcludedLibraryIds', route: 'Library/VirtualFolders',
                          read: function (folders) {
                              return folders.filter(function (f) { return f.ItemId; })
                                  .map(function (f) { return { id: f.ItemId, name: f.Name }; });
                          } }
                    ];

                    sources.forEach(function (source) {
                        var answer;
                        try {
                            answer = ApiClient.getJSON(ApiClient.getUrl(source.route));
                        } catch (e) {
                            answer = Promise.reject(e);
                        }

                        Promise.resolve(answer).then(function (result) {
                            if (!Array.isArray(result) || result.length === 0) {
                                showRaw(source.list, source.raw);
                                return;
                            }
                            renderPicks(source.list, source.raw, source.target, source.read(result));
                        }, function () {
                            showRaw(source.list, source.raw);
                        });
                    });
                }

                /* Une case cochée réécrit la liste enregistrée, dans la zone de texte cachée. */
                function wirePicks() {
                    [['mcPickUsers', 'ExcludedUserIds'], ['mcPickLibraries', 'ExcludedLibraryIds']].forEach(function (pair) {
                        field(pair[0]).addEventListener('change', function () {
                            field(pair[1]).value = Array.prototype.map.call(
                                field(pair[0]).querySelectorAll('input[data-pick]:checked'),
                                function (box) { return box.getAttribute('data-pick'); }).join('\n');
                        });
                    });
                }

                // ----------------------------------------------------------
                // Affichage conditionnel
                // ----------------------------------------------------------

                /* Ce qu'une case seule ne dit pas. Le comptage par nombre de lectures sert à
                   « de tous les temps », et au Top du serveur quand Playback Reporting manque
                   ou que la période est nulle : avec lui, seules comptent les vraies lectures. */
                var predicates = {
                    playCount: function () {
                        var days = parseInt(field('LocalTopWindowDays').value, 10) || 0;
                        var playback = !!(status && status.PlaybackReporting);
                        return field('EnableAllTimeRow').checked
                            || (field('EnableLocalTop').checked && (days === 0 || !playback));
                    }
                };

                /* « A|B » : l'un ou l'autre ; « A&B » : les deux ; « !A » : décoché ;
                   « A=valeur » : liste sur cette valeur ; « @nom » : condition ci-dessus. */
                function holds(term) {
                    var negate = term.charAt(0) === '!';
                    var body = negate ? term.substring(1) : term;
                    var result;

                    if (body.charAt(0) === '@') {
                        result = predicates[body.substring(1)]();
                    } else {
                        var parts = body.split('=');
                        var input = field(parts[0]);
                        result = parts.length > 1 ? input.value === parts[1] : input.checked;
                    }

                    return negate ? !result : result;
                }

                function shown(condition) {
                    return condition.split('|').some(function (alternative) {
                        return alternative.split('&').every(holds);
                    });
                }

                /* Un bloc masqué l'est avec ses champs, retirés du parcours clavier ET de la
                   validation : un nombre requis laissé vide dans un bloc invisible bloquerait
                   sinon l'enregistrement sans rien montrer. Les champs sont réglés après tous
                   les blocs, d'après n'importe quel bloc masqué qui les contient : un bloc
                   imbriqué (Seerr sous le Top mondial) suit ainsi sa case ET celle de son parent. */
                function applyVisibility() {
                    var blocks = page.querySelectorAll('[data-show-if]');
                    for (var i = 0; i < blocks.length; i++) {
                        blocks[i].hidden = !shown(blocks[i].getAttribute('data-show-if'));
                    }

                    var controls = page.querySelectorAll('[data-show-if] input, [data-show-if] select, '
                        + '[data-show-if] textarea, [data-show-if] button');
                    for (var j = 0; j < controls.length; j++) {
                        controls[j].disabled = controls[j].closest('[data-show-if][hidden]') !== null;
                    }
                }

                /* Les champs dont dépend l'affichage, relevés dans les conditions elles-mêmes :
                   une condition ajoutée au HTML est suivie sans toucher au script. La période
                   s'y ajoute, lue par la condition nommée `playCount`, et les réglages que les
                   chiffres et les pastilles reflètent. */
                function watchedFields() {
                    var ids = ['EnableHomeRows', 'LocalTopWindowDays', 'AllowUserPreferences', 'GlobalTopProvider']
                        .concat(rowToggles);
                    var blocks = page.querySelectorAll('[data-show-if]');

                    for (var i = 0; i < blocks.length; i++) {
                        blocks[i].getAttribute('data-show-if').split(/[|&]/).forEach(function (term) {
                            var id = term.replace(/^!/, '').split('=')[0];
                            if (id.charAt(0) !== '@' && ids.indexOf(id) === -1) {
                                ids.push(id);
                            }
                        });
                    }

                    return ids;
                }

                function onSettingChange() {
                    applyVisibility();
                    buildNav();
                    refreshDuplicateAlert();
                    renderStatus();
                }

                function wireSettings() {
                    watchedFields().forEach(function (id) {
                        var input = field(id);
                        input.addEventListener('change', onSettingChange);
                        if (input.type === 'number') {
                            input.addEventListener('input', onSettingChange);
                        }
                    });

                    // Les champs qui alimentent l'avertissement le rafraîchissent.
                    ['LocalRowTitle', 'GlobalRowTitle', 'GlobalMoviesRowTitle', 'GlobalSeriesRowTitle',
                        'LocalCollectionName', 'GlobalCollectionName']
                        .forEach(function (id) {
                            field(id).addEventListener('input', refreshDuplicateAlert);
                        });

                    // Et ceux que reflètent les pastilles.
                    ['GlobalTopApiKey', 'SeerrUrl', 'SeerrApiKey'].forEach(function (id) {
                        field(id).addEventListener('input', renderStatus);
                    });

                    // Un champ invalide caché dans le pli fermé ne pourrait pas montrer son
                    // erreur : le navigateur refuserait l'envoi sans rien dire. Le pli s'ouvre.
                    field('mediaCarouselConfigForm').addEventListener('invalid', function (event) {
                        var fold = event.target.closest('details');
                        if (fold) {
                            fold.open = true;
                        }
                    }, true);
                }

                // ----------------------------------------------------------
                // Rangées : cases et ordre
                // ----------------------------------------------------------

                /* Doivent rester synchronisés avec PLUGIN_ROW_ORDER et FULL_ROW_ORDER
                   de media-carousel.js. */
                var pluginRowIds = ['local', 'alltime', 'global', 'returning', 'neverplayed', 'because', 'studios', 'genres'];
                var fullRowIds = [
                    'native:smalllibrarytiles', 'native:librarybuttons',
                    'local', 'alltime', 'global', 'returning', 'neverplayed', 'because', 'studios', 'genres',
                    'native:activerecordings', 'native:resume', 'native:resumeaudio',
                    'native:resumebook', 'native:livetv', 'native:nextup', 'native:latestmedia'
                ];

                function activeRowIds() {
                    return field('ManageNativeSections').checked ? fullRowIds : pluginRowIds;
                }

                /* Même règle que le client : inconnus ignorés, manquants réinsérés à leur
                   place par défaut — pas à la fin, sinon activer la gestion des natives les
                   ferait toutes basculer sous nos rangées. */
                function normalizeOrder(value) {
                    var reference = activeRowIds();
                    var order = [];

                    String(value || '').toLowerCase().split(',').forEach(function (raw) {
                        var id = raw.replace(/^\s+|\s+$/g, '');
                        if (reference.indexOf(id) !== -1 && order.indexOf(id) === -1) {
                            order.push(id);
                        }
                    });

                    reference.forEach(function (id, index) {
                        if (order.indexOf(id) === -1) {
                            order.splice(Math.min(index, order.length), 0, id);
                        }
                    });

                    return order;
                }

                /* Ces noms sont ceux de Jellyfin lui-même — les mêmes que dans « Écran
                   d'accueil » des préférences du compte. En inventer d'autres revenait à faire
                   chercher « À suivre » dans une liste qui affichait « Prochainement ». */
                function nativeItem(id) {
                    var li = document.createElement('li');
                    li.setAttribute('data-row', id);
                    li.innerHTML = '<span class="mcCfg-order-rank"></span>'
                        + '<span class="mcCfg-order-name mcCfg-order-native">' + escapeHtml(T.native[id]) + '</span>'
                        + '<button is="emby-button" type="button" class="raised mcCfg-order-up">&#9650;</button>'
                        + '<button is="emby-button" type="button" class="raised mcCfg-order-down">&#9660;</button>';
                    return li;
                }

                /* Les rangées du plugin sont écrites dans la page, chacune avec sa case : on ne
                   fait que les remettre dans l'ordre, sans jamais les recréer — la case garde
                   son état et ses écouteurs. Seules les sections de Jellyfin, sans case, sont
                   ajoutées ou retirées ici. */
                function renderRowOrder() {
                    var order = normalizeOrder(field('RowOrder').value);
                    var list = field('mcRowOrder');
                    var items = {};

                    Array.prototype.slice.call(list.children).forEach(function (li) {
                        var id = li.getAttribute('data-row');
                        if (order.indexOf(id) === -1) {
                            list.removeChild(li);
                        } else {
                            items[id] = li;
                        }
                    });

                    order.forEach(function (id) {
                        list.appendChild(items[id] || nativeItem(id));
                    });

                    labelRowButtons();
                    refreshOrderState();
                }

                /* Remet à jour rangs, boutons et champ caché sans toucher au balisage :
                   chaque `is="emby-button"` recréé devait être ré-initialisé par Jellyfin, la
                   liste clignotait, et le nœud qui portait le focus disparaissait. */
                function refreshOrderState() {
                    var items = field('mcRowOrder').children;
                    var ids = [];

                    for (var i = 0; i < items.length; i++) {
                        ids.push(items[i].getAttribute('data-row'));
                        items[i].querySelector('.mcCfg-order-rank').textContent = i + 1;
                        items[i].querySelector('.mcCfg-order-up').disabled = i === 0;
                        items[i].querySelector('.mcCfg-order-down').disabled = i === items.length - 1;
                    }

                    field('RowOrder').value = ids.join(',');
                }

                /* Un seul écouteur sur la liste : les boutons vont et viennent avec les
                   éléments déplacés, des écouteurs par bouton disparaîtraient avec eux. */
                function wireRowOrder() {
                    field('mcRowOrder').addEventListener('click', function (event) {
                        var button = event.target.closest('.mcCfg-order-up, .mcCfg-order-down');
                        if (!button || button.disabled) {
                            return;
                        }

                        var li = button.closest('li');
                        var list = field('mcRowOrder');
                        var up = button.className.indexOf('mcCfg-order-up') !== -1;
                        var neighbour = up ? li.previousElementSibling : li.nextElementSibling;

                        if (!neighbour) {
                            return;
                        }

                        // Un seul échange de deux nœuds : les autres ne bougent pas.
                        list.insertBefore(up ? li : neighbour, up ? neighbour : li);
                        refreshOrderState();

                        // Le focus suit la rangée déplacée, sinon la navigation au clavier
                        // repart du début de la page à chaque appui. `preventScroll` est
                        // indispensable : sans lui, focaliser ramène l'élément dans le champ
                        // de vision et fait sauter la page à chaque clic.
                        //
                        // Arrivée en bout de liste, la flèche utilisée devient inerte : le
                        // focus passe alors à l'autre, sinon il retombe sur le corps du
                        // document et la tabulation suivante repart du haut de la page.
                        var same = li.querySelector(up ? '.mcCfg-order-up' : '.mcCfg-order-down');
                        var other = li.querySelector(up ? '.mcCfg-order-down' : '.mcCfg-order-up');
                        var focusTarget = same && !same.disabled ? same : other;

                        if (focusTarget && !focusTarget.disabled) {
                            focusTarget.focus({ preventScroll: true });
                        }
                    });
                }

                // ----------------------------------------------------------
                // Services, chiffres clés et calcul
                // ----------------------------------------------------------

                var marks = { ok: '✓', warn: '!', off: '–', pending: '…' };

                /* `target` : le réglage où mène un clic ; sans lui, une pastille n'est qu'une étiquette. */
                function chip(state, name, detail, target) {
                    var inner = '<span class="mcCfg-chip-mark" aria-hidden="true">' + marks[state] + '</span>'
                        + '<span>' + escapeHtml(name) + '</span>'
                        + '<span class="mcCfg-chip-detail">· ' + escapeHtml(detail) + '</span>';
                    return '<li>' + (target
                        ? '<button type="button" class="mcCfg-chip" data-state="' + state + '" data-go="' + target + '">' + inner + '</button>'
                        : '<span class="mcCfg-chip" data-state="' + state + '">' + inner + '</span>') + '</li>';
                }

                function tile(state, name, value, detail) {
                    return '<button type="button" class="mcCfg-tile" data-state="' + state + '">'
                        + '<span class="mcCfg-tile-name"><span class="mcCfg-tile-dot"></span>' + escapeHtml(name) + '</span>'
                        + '<span class="mcCfg-tile-value">' + escapeHtml(value) + '</span>'
                        + '<span class="mcCfg-tile-detail">' + escapeHtml(detail) + '</span>'
                        + '</button>';
                }

                /* Le réglage de chaque chiffre, dans l'ordre où ils s'affichent. */
                var tileTargets = ['LocalTopWindowDays', 'GlobalTopApiKey', 'EnableSeerrRequests', 'AllowUserPreferences'];

                function seerrReady() {
                    return field('SeerrUrl').value.trim().length > 0 && field('SeerrApiKey').value.trim().length > 0;
                }

                /* Les services dont dépend le plugin : un coup d'œil dit ce qui manque. */
                function renderHealth() {
                    var globalOn = field('EnableGlobalTop').checked;
                    var hasKey = field('GlobalTopApiKey').value.trim().length > 0;
                    var seerrOn = globalOn && field('EnableSeerrRequests').checked;
                    var keyName = t('chipKeyName', { provider: providerName() });

                    field('mcHealth').innerHTML =
                        chip(status.PlaybackReporting ? 'ok' : 'off', 'Playback Reporting',
                            t(status.PlaybackReporting ? 'chipPresent' : 'chipAbsent'))
                        + chip(!globalOn ? 'off' : hasKey ? 'ok' : 'warn', keyName,
                            t(!globalOn ? 'chipOff' : hasKey ? 'chipKeySet' : 'chipKeyMissing'), 'GlobalTopApiKey')
                        + chip(!seerrOn ? 'off' : seerrReady() ? 'ok' : 'warn', 'Seerr',
                            t(!seerrOn ? 'chipOff' : seerrReady() ? 'chipReady' : 'chipIncomplete'), 'EnableSeerrRequests')
                        + chip(status.FileTransformation ? 'ok' : 'warn', 'File Transformation',
                            t(status.FileTransformation ? 'chipPresent' : 'chipFtAbsent'));
                }

                /* Combien de comptes ont vraiment regardé, sur la période du Top du serveur.
                   Le serveur ne le sait qu'avec Playback Reporting, après un premier calcul. */
                function activityTile() {
                    var activity = status.Activity;
                    var days = parseInt(field('LocalTopWindowDays').value, 10) || 0;
                    // Le nom suit la période réglée, même sans chiffre à montrer.
                    var title = days === 7 || days === 0 ? t('figActivityWeek') : t('figActivityDays', { n: days });

                    if (!status.PlaybackReporting) {
                        return tile('off', title, '—', t('figActivityNeedsPlayback'));
                    }
                    if (!field('EnableLocalTop').checked || days === 0) {
                        return tile('off', title, '—', t('figActivityNoWindow'));
                    }
                    if (!activity) {
                        return tile('pending', title, '—', t('figActivityPending'));
                    }

                    var name = activity.WindowDays === 7 ? t('figActivityWeek') : t('figActivityDays', { n: activity.WindowDays });
                    var hours = Number(activity.Hours || 0).toLocaleString(locale(), { maximumFractionDigits: 1 });

                    return tile(activity.Viewers ? 'ok' : 'pending', name, String(activity.Viewers),
                        t('figActivityDetail', {
                            accounts: t(activity.Viewers === 1 ? 'accountOne' : 'accountMany'),
                            views: plural(activity.Views, 'viewOne', 'viewMany'),
                            hours: hours
                        }));
                }

                /* Les titres du Top mondial que la bibliothèque a déjà, et ceux qui manquent. */
                function globalTiles() {
                    var total = status.GlobalTotal || 0;
                    var have = status.GlobalInLibrary || 0;

                    if (!field('EnableGlobalTop').checked) {
                        return tile('off', t('figGlobal'), '—', t('figGlobalOff'))
                            + tile('off', t('figRequest'), '—', t('figGlobalOff'));
                    }
                    if (!field('GlobalTopApiKey').value.trim()) {
                        return tile('warn', t('figGlobal'), t('figGlobalNoKey'), t('figGlobalNoKeyDetail', { provider: providerName() }))
                            + tile('off', t('figRequest'), '—', t('figGlobalNoKeyDetail', { provider: providerName() }));
                    }
                    if (!total) {
                        return tile('pending', t('figGlobal'), '—', t('figGlobalPending'))
                            + tile('pending', t('figRequest'), '—', t('figGlobalPending'));
                    }

                    var html = tile('ok', t('figGlobal'), have + ' / ' + total, t('figGlobalDetail'));

                    if (field('GlobalTopLibraryOnly').checked) {
                        html += tile('off', t('figRequest'), '—', t('figRequestHidden'));
                    } else {
                        var seerr = field('EnableSeerrRequests').checked && seerrReady();
                        html += tile(seerr ? 'ok' : 'pending', t('figRequest'), String(total - have),
                            t(seerr ? 'figRequestSeerr' : 'figRequestNoSeerr'));
                    }

                    return html;
                }

                function accountsTile() {
                    if (!field('AllowUserPreferences').checked) {
                        return tile('off', t('figAccounts'), '—', t('figAccountsOff'));
                    }
                    var count = status.CustomizedAccounts || 0;
                    var value = status.Accounts ? count + ' / ' + status.Accounts : String(count);
                    return tile(count ? 'ok' : 'pending', t('figAccounts'), value, t('figAccountsDetail'));
                }

                function lastComputed() {
                    var newest = null;

                    Object.keys(T.sections).forEach(function (key) {
                        var when = status && status[key] && status[key].GeneratedUtc;
                        if (when && (!newest || new Date(when) > new Date(newest))) {
                            newest = when;
                        }
                    });

                    return newest;
                }

                /* Le bilan d'exécution prime sur les dates : la tolérance aux pannes conserve
                   les instantanés précédents, donc sans lui une clé expirée laisserait un
                   calcul « réussi » dont la date vieillit en silence. */
                function renderRun() {
                    var run = status.LastRun || {};
                    var failures = run.Failures || [];
                    var newest = lastComputed();
                    var state;
                    var value;
                    var detail;

                    if (run.Running) {
                        state = 'pending';
                        value = t('runRunning');
                        detail = '';
                    } else if (failures.length) {
                        var firstMessage = failures[0].Message || '';
                        if (firstMessage.length > 120) {
                            firstMessage = firstMessage.substring(0, 120) + '…';
                        }
                        state = 'warn';
                        value = t('runFailed', { sections: failures.map(function (f) { return f.Section; }).join(', ') });
                        detail = firstMessage || t('runFailedDetail');
                    } else if (newest) {
                        var parts = [formatDate(newest)];
                        if (typeof run.DurationSeconds === 'number') {
                            parts.push(run.DurationSeconds < 1 ? t('runLessThanSecond') : Math.round(run.DurationSeconds) + ' s');
                        }
                        if (status.NextRunUtc) {
                            parts.push(t('runNext', { when: relativeDate(status.NextRunUtc) }));
                        }
                        state = 'ok';
                        value = t('runLast', { when: relativeDate(newest) });
                        detail = parts.join(' · ');
                    } else {
                        state = 'pending';
                        value = t('runNever');
                        detail = t('runNeverDetail');
                    }

                    field('mcRun').setAttribute('data-state', state);
                    field('mcRunValue').textContent = value;
                    field('mcRunDetail').textContent = detail;
                }

                function renderStatus() {
                    var activeRows = rowToggles.filter(function (id) { return field(id).checked; }).length;
                    field('mcActiveRows').textContent = t('activeRows', { n: activeRows, total: rowToggles.length });

                    if (!status) {
                        return;
                    }

                    field('mcVersion').textContent = status.Version ? 'v' + status.Version : '';
                    renderHealth();
                    field('mcStatus').innerHTML = activityTile() + globalTiles() + accountsTile();
                    Array.prototype.forEach.call(field('mcStatus').children, function (tileButton, index) {
                        tileButton.setAttribute('data-go', tileTargets[index]);
                    });
                    renderPrefsNote();
                    renderRun();
                    renderSectionStates();
                }

                /* Le détail de chaque section rejoint son bloc. Une rangée décochée n'y
                   figure pas : la liste des rangées le dit déjà. */
                function renderSectionStates() {
                    var holders = page.querySelectorAll('[data-state-for]');

                    for (var i = 0; i < holders.length; i++) {
                        var parts = [];
                        var keys = holders[i].getAttribute('data-state-for').split(',');

                        for (var k = 0; k < keys.length; k++) {
                            var data = (status && status[keys[k]]) || {};
                            var when = formatDate(data.GeneratedUtc);

                            if (!data.Enabled) {
                                continue;
                            }

                            if (when) {
                                parts.push(t('sectionComputed', { name: T.sections[keys[k]], count: data.Count || 0, when: when })
                                    + (data.Source === 'PlaybackReporting' ? t('sectionPlayback') : ''));
                            } else {
                                parts.push(t('sectionPending', { name: T.sections[keys[k]] }));
                            }
                        }

                        holders[i].textContent = parts.join(' · ');
                    }
                }

                function loadStatus() {
                    return ApiClient.getJSON(ApiClient.getUrl('MediaCarousel/Status')).then(function (result) {
                        status = result;
                        renderStatus();
                        // La présence de Playback Reporting décide de ce que montre le pli.
                        applyVisibility();
                    }, function () {
                        field('mcStatus').textContent = t('statusUnavailable');
                    });
                }

                // ----------------------------------------------------------
                // Avertissement de doublon
                // ----------------------------------------------------------

                /* Ignore casse, accents, ponctuation et espaces : « Top 10 mondial » et
                   « top-10 mondial » désignent visiblement la même rangée. */
                function identity(value) {
                    return String(value || '').toLowerCase()
                        .normalize('NFD').replace(/[̀-ͯ]/g, '')
                        .replace(/[^a-z0-9]/g, '');
                }

                function refreshDuplicateAlert() {
                    var alert = field('mcDuplicateAlert');
                    var clashes = [];

                    if (field('SyncCollections').checked && field('EnableHomeRows').checked) {
                        duplicatePairs.forEach(function (pair) {
                            var name = identity(field(pair.collection).value);

                            pair.rows().forEach(function (row) {
                                if (field(pair.enable).checked && name.length > 0
                                    && name === identity(field(row).value)) {
                                    clashes.push(t(pair.label) + ' (' + t('quoteOpen') + field(row).value + t('quoteClose') + ')');
                                }
                            });
                        });
                    }

                    alert.hidden = clashes.length === 0;

                    if (clashes.length > 0) {
                        alert.innerHTML = '<span aria-hidden="true">&#9888;</span><span>'
                            + '<strong>' + escapeHtml(t(clashes.length > 1 ? 'dupMany' : 'dupOne')) + '</strong>'
                            + escapeHtml(t('dupText', { list: clashes.join(', ') }))
                            + '</span>';
                    }
                }

                // ----------------------------------------------------------
                // Seerr
                // ----------------------------------------------------------

                var seerrTestMessages = {
                    invalid: 'seerrInvalid',
                    unauthorized: 'seerrUnauthorized',
                    forbidden: 'seerrForbidden',
                    offline: 'seerrOffline',
                    error: 'seerrError'
                };

                function testSeerr() {
                    var result = field('seerrTestResult');
                    result.textContent = t('seerrTesting');

                    // Les valeurs saisies, pas celles enregistrées : on vérifie avant d'enregistrer.
                    ApiClient.ajax({
                        type: 'POST',
                        url: ApiClient.getUrl('MediaCarousel/Seerr/Test'),
                        data: JSON.stringify({ Url: field('SeerrUrl').value, ApiKey: field('SeerrApiKey').value }),
                        contentType: 'application/json',
                        dataType: 'json'
                    }).then(function (answer) {
                        result.textContent = answer && answer.Ok
                            ? t('seerrOk')
                            : t(seerrTestMessages[(answer && answer.Error) || 'error'] || 'seerrError');
                    }, function () {
                        result.textContent = t('seerrNotStarted');
                    });
                }

                // ----------------------------------------------------------
                // Cycle de vie
                // ----------------------------------------------------------

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    say('');

                    // La langue du compte a pu changer depuis le dernier affichage.
                    var wanted = detectLanguage();
                    if (wanted !== lang) {
                        lang = wanted;
                        T = strings[lang];
                        applyTranslations();
                        buildNav();
                        applyHints(hintsShown());
                    }

                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        checkboxes.forEach(function (id) { field(id).checked = !!config[id]; });
                        numbers.forEach(function (id) { field(id).value = config[id]; });
                        decimals.forEach(function (id) { field(id).value = config[id]; });
                        texts.forEach(function (id) {
                            field(id).value = config[id] == null ? '' : String(config[id]);
                        });
                        field('HighlightColor').value = colorForInput(config.HighlightColor);
                        lists.forEach(function (id) { field(id).value = (config[id] || []).join('\n'); });

                        // `pageshow` revient à chaque retour sur la page : jellyfin-web réaffiche
                        // alors la même page, gardée en cache. Les écouteurs ne se posent qu'une
                        // fois — posés deux fois, « Descendre » faisait reculer une rangée de deux
                        // places. Seul l'état, relu de la configuration, se réapplique.
                        if (!wired) {
                            wired = true;
                            wireSettings();
                            wireRowOrder();
                            field('seerrTestButton').addEventListener('click', testSeerr);
                            field('ManageNativeSections').addEventListener('change', renderRowOrder);
                            wirePicks();
                            wireShortcuts();
                            wireHints();
                            wireResetAll();
                            field('mcRowsOn').addEventListener('click', function () {
                                field('EnableHomeRows').checked = true;
                                field('EnableHomeRows').dispatchEvent(new Event('change', { bubbles: true }));
                            });
                            window.addEventListener('resize', function () {
                                if (dirty) {
                                    placeSaveBar();
                                }
                            }, { passive: true });
                            // Tout ce qui se modifie dans le formulaire remonte ici, cases des
                            // exclusions et flèches des rangées comprises.
                            field('mediaCarouselConfigForm').addEventListener('input', function () { setDirty(true); });
                            field('mediaCarouselConfigForm').addEventListener('change', function () { setDirty(true); });
                            field('mcRowOrder').addEventListener('click', function (event) {
                                if (event.target.closest('.mcCfg-order-up, .mcCfg-order-down')) {
                                    setDirty(true);
                                }
                            });
                        }

                        applyVisibility();
                        renderRowOrder();
                        refreshDuplicateAlert();
                        renderStatus();
                        loadPicks();
                        buildNav();
                        setDirty(false);
                        applyHints(hintsShown());
                        resetArmed = false;
                        field('mcResetAllResult').textContent = '';
                        renderPrefsNote();

                        Dashboard.hideLoadingMsg();
                        loadStatus();
                    }, function () {
                        Dashboard.hideLoadingMsg();
                        say(t('loadFailed'));
                    });
                });

                /* Enregistre le formulaire. « Recalculer maintenant » passe aussi par là : une
                   case cochée puis ce bouton pressé, sans « Enregistrer », recalculait avec
                   l'ancien réglage, et le choix était perdu (constaté en prod le 2026-09-28). */
                var changed = false;

                function save() {
                    Dashboard.showLoadingMsg();

                    var before;

                    return ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        before = JSON.stringify(config);
                        checkboxes.forEach(function (id) { config[id] = field(id).checked; });
                        // Un nombre vide — possible seulement dans un bloc masqué, hors validation —
                        // garde sa valeur au lieu de tomber à zéro.
                        numbers.forEach(function (id) {
                            config[id] = field(id).value === '' ? config[id] : parseInt(field(id).value, 10) || 0;
                        });
                        decimals.forEach(function (id) {
                            config[id] = field(id).value === '' ? config[id] : parseFloat(field(id).value) || 0;
                        });
                        texts.forEach(function (id) { config[id] = field(id).value; });
                        lists.forEach(function (id) { config[id] = toList(field(id).value); });

                        // Le serveur ne recalcule que si un réglage a changé : on ne promet rien d'autre.
                        changed = JSON.stringify(config) !== before;
                        return ApiClient.updatePluginConfiguration(pluginId, config);
                    }).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                        setDirty(false);
                        return true;
                    }, function () {
                        Dashboard.hideLoadingMsg();
                        say(t('saveFailed'));
                        return false;
                    });
                }

                page.querySelector('#mediaCarouselConfigForm').addEventListener('submit', function (event) {
                    event.preventDefault();
                    say('');

                    save().then(function (saved) {
                        if (saved) {
                            // Le serveur relance lui-même le recalcul dès qu'un réglage change.
                            say(t(changed ? 'saved' : 'savedSame'));
                            loadStatus();
                            if (changed) {
                                window.setTimeout(loadStatus, 10000);
                            }
                        }
                    });

                    return false;
                });

                page.querySelector('#refreshNowButton').addEventListener('click', function () {
                    var form = page.querySelector('#mediaCarouselConfigForm');

                    // Les mêmes contrôles qu'« Enregistrer » : un nombre vidé serait sinon
                    // enregistré à zéro.
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }

                    say(t('refreshStarting'));

                    save().then(function (saved) {
                        if (!saved) {
                            return;
                        }

                        ApiClient.ajax({
                            type: 'POST',
                            url: ApiClient.getUrl('MediaCarousel/Top/Refresh')
                        }).then(function () {
                            say(t('refreshStarted'));
                            // Le recalcul est asynchrone : on relit l'état un peu plus tard.
                            window.setTimeout(loadStatus, 5000);
                            window.setTimeout(loadStatus, 20000);
                        }, function () {
                            say(t('refreshFailed'));
                        });
                    });
                });
            })();
        </script>
    </div>
</body>

</html>
