name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Ligne Jellyfin 12, au format de NotifySync : son propre catalogue, ses tags suffixes,
# et le PLANCHER 12.0 comme targetAbi — compile contre 12.0.0, le build se charge sur
# 12.0 comme sur 12.1, alors qu'une DLL compilee contre 12.1 ne se charge pas sur 12.0.
env:
  CATALOG: repository-12.json
  TAG_SUFFIX: -jf12
  TARGET_ABI: 12.0.0.0

jobs:
  # Y a-t-il quelque chose a publier ? Sans cette porte, le passage horaire
  # sortirait une version identique a la precedente toutes les heures.
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.pending.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commits en attente depuis la derniere version
        id: pending
        run: |
          # Tag le plus proche dans l'ascendance de HEAD, et non le plus haut du depot :
          # les lignes 10.11 et 12 partagent le meme espace de tags, et prendre le plus
          # haut faisait lire a chacune les versions de l'autre.
          LAST_TAG=$(git describe --tags --abbrev=0 --match "*${TAG_SUFFIX}" 2>/dev/null \
            || git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          # Les commits de la CI elle-meme portent [skip ci] : les compter
          # relancerait une publication a chaque passage, indefiniment.
          COUNT=$(git log $RANGE --no-merges --pretty=format:"%s" | grep -vc "\[skip ci\]" || true)
          COUNT=${COUNT:-0}

          echo "$COUNT commit(s) a publier depuis ${LAST_TAG:-le debut}"
          if [ "$COUNT" -gt 0 ]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bump version
        id: ver
        run: |
          # Lire la version (peut etre 1.2.0 ou 1.2.0.0), normaliser en 3 parties
          RAW_VER=$(python3 -c "import json; d=json.load(open('$CATALOG')); print(d[0]['versions'][0]['version'])")
          CURRENT=$(echo "$RAW_VER" | cut -d. -f1-3)
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"

          # Tag le plus proche dans l'ascendance de HEAD, et non le plus haut du depot :
          # les lignes 10.11 et 12 partagent le meme espace de tags, et prendre le plus
          # haut faisait lire a chacune les versions de l'autre.
          LAST_TAG=$(git describe --tags --abbrev=0 --match "*${TAG_SUFFIX}" 2>/dev/null \
            || git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"%s" | head -20)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --no-merges --pretty=format:"%s")
          fi

          # breaking change ou ! -> majeur | feat -> mineur | reste -> patch
          if echo "$COMMITS" | grep -qiE "BREAKING.CHANGE|^[a-z]+(\([^)]*\))?!:"; then
            MAJ=$((MAJ+1)); MIN=0; PAT=0
          elif echo "$COMMITS" | grep -qi "^feat"; then
            MIN=$((MIN+1)); PAT=0
          else
            PAT=$((PAT+1))
          fi

          NEW="${MAJ}.${MIN}.${PAT}"
          NEW_FULL="${NEW}.0"
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "$CURRENT -> $NEW_FULL"

          TODAY=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Format NotifySync : le catalogue affiche un lien vers les notes de la release.
          CHANGELOG="<a style='color:white;text-decoration:none' href=\"https://github.com/peterdu1109/MediaCarousel/releases/tag/${NEW}${TAG_SUFFIX}\">📋 <span style='text-decoration:underline'>Release Notes v${NEW}</span></a>"

          # Prépendre une nouvelle entrée — ne jamais écraser l'historique
          jq --arg v "$NEW_FULL" --arg chg "$CHANGELOG" --arg ts "$TODAY" --arg abi "$TARGET_ABI" \
            '.[0].versions = [{"version":$v,"changelog":$chg,"targetAbi":$abi,"sourceUrl":"","checksum":"","timestamp":$ts}] + .[0].versions' \
            "$CATALOG" > catalog.tmp && mv catalog.tmp "$CATALOG"

          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${NEW_FULL}</AssemblyVersion>|" JellyfinCarouselPlugin.csproj
          sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>${NEW_FULL}</FileVersion>|" JellyfinCarouselPlugin.csproj

      - name: Build
        run: |
          dotnet restore JellyfinCarouselPlugin.csproj --configfile nuget.config
          dotnet build JellyfinCarouselPlugin.csproj -c Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: |
          dotnet run --project tests/ScriptTag.Tests -c Release
          cd tests/browser
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node home-rows.test.mjs
          node config-page.test.mjs

      - name: Package ZIP
        run: |
          cd bin/Release/net10.0
          zip -r ../../../JellyfinCarouselPlugin.zip .

      - name: Update manifest sourceUrl + checksum
        run: |
          V=${{ steps.ver.outputs.version }}
          MD5=$(md5sum JellyfinCarouselPlugin.zip | awk '{print $1}')
          URL="https://github.com/peterdu1109/MediaCarousel/releases/download/${V}${TAG_SUFFIX}/JellyfinCarouselPlugin.zip"
          jq --arg url "$URL" --arg md5 "$MD5" '.[0].versions[0].sourceUrl=$url | .[0].versions[0].checksum=$md5' "$CATALOG" > catalog.tmp
          mv catalog.tmp "$CATALOG"

      - name: Commit version bump
        run: |
          git config user.name "peterdu1109"
          git config user.email "peter1109@hotmail.fr"
          git add "$CATALOG" JellyfinCarouselPlugin.csproj
          git diff --cached --quiet || git commit -m "chore: bump ${{ steps.ver.outputs.version }} [skip ci]"
          # Sur la branche de portage, le bump doit rester sur la branche : le
          # pousser sur main y ferait entrer la ligne 12, que main ne construit
          # pas, et le catalogue que lit un serveur 10.11 annoncerait une version
          # batie pour un autre socle.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinCarouselPlugin
          path: JellyfinCarouselPlugin.zip
          retention-days: 30

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          TAG="${V}${TAG_SUFFIX}"
          # HEAD est le commit de bump et le nouveau tag n'existe pas encore : on obtient
          # bien la version precedente de CETTE ligne.
          # Tag le plus proche dans l'ascendance de HEAD, et non le plus haut du depot :
          # les lignes 10.11 et 12 partagent le meme espace de tags, et prendre le plus
          # haut faisait lire a chacune les versions de l'autre.
          LAST_TAG=$(git describe --tags --abbrev=0 --match "*${TAG_SUFFIX}" 2>/dev/null \
            || git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            RAW=$(git log --no-merges --pretty=format:"%s" | grep -v "\[skip ci\]" | head -30)
          else
            RAW=$(git log "${LAST_TAG}..HEAD" --no-merges --pretty=format:"%s" | grep -v "\[skip ci\]")
          fi
          [ -z "$RAW" ] && RAW="Mise a jour et corrections diverses"

          NOTES=$(printf '%s\n' "$RAW" | python3 .github/scripts/release_notes.py)

          # Les notes disent CE QUI CHANGE, et rien d'autre. Le mode d'installation ne
          # change pas d'une version a l'autre : le repeter a chaque release noie les
          # quelques lignes qu'on vient vraiment lire. Il vit dans le README.
          N=/tmp/notes.md
          {
            echo "# Media Carousel v$V — Jellyfin 12"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo
            echo "Jellyfin 12.0 ou plus recent. Installation :"
            echo "[README de la ligne 12](https://github.com/peterdu1109/MediaCarousel/tree/jellyfin-12#readme)."
          } > "$N"

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # Tant que la ligne 12 vit sur une branche, sa release ne doit pas
          # passer « latest » devant la version que les serveurs 10.11 utilisent.
          PRERELEASE=""
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            PRERELEASE="--prerelease"
          fi

          # --target est indispensable : sans lui, gh pose un tag neuf sur la branche PAR
          # DEFAUT. La 4.0.1 s'est ainsi retrouvee taguee sur le source 10.11 de main.
          gh release create "$TAG" $PRERELEASE \
            --target "$(git rev-parse HEAD)" \
            --title "Media Carousel v${V} — Jellyfin 12" \
            --notes-file "$N" \
            JellyfinCarouselPlugin.zip
