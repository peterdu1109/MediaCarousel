name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Y a-t-il quelque chose a publier ? Sans cette porte, le passage horaire
  # sortirait une version identique a la precedente toutes les heures.
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.pending.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commits en attente depuis la derniere version
        id: pending
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          # Les commits de la CI elle-meme portent [skip ci] : les compter
          # relancerait une publication a chaque passage, indefiniment.
          COUNT=$(git log $RANGE --no-merges --pretty=format:"%s" | grep -vc "\[skip ci\]" || true)
          COUNT=${COUNT:-0}

          echo "$COUNT commit(s) a publier depuis ${LAST_TAG:-le debut}"
          if [ "$COUNT" -gt 0 ]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Bump version
        id: ver
        run: |
          # Lire la version (peut etre 1.2.0 ou 1.2.0.0), normaliser en 3 parties
          RAW_VER=$(python3 -c "import json; d=json.load(open('manifest.json')); print(d[0]['versions'][0]['version'])")
          CURRENT=$(echo "$RAW_VER" | cut -d. -f1-3)
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"

          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"%s" | head -20)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --no-merges --pretty=format:"%s")
          fi

          # breaking change ou ! -> majeur | feat -> mineur | reste -> patch
          if echo "$COMMITS" | grep -qiE "BREAKING.CHANGE|^[a-z]+(\([^)]*\))?!:"; then
            MAJ=$((MAJ+1)); MIN=0; PAT=0
          elif echo "$COMMITS" | grep -qi "^feat"; then
            MIN=$((MIN+1)); PAT=0
          else
            PAT=$((PAT+1))
          fi

          NEW="${MAJ}.${MIN}.${PAT}"
          NEW_FULL="${NEW}.0"
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "$CURRENT -> $NEW_FULL"

          TODAY=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Meme mise en forme que les notes de release, en version compacte :
          # Jellyfin affiche ce champ tel quel dans son catalogue d'extensions.
          CHANGELOG=$(printf '%s\n' "$COMMITS" | python3 .github/scripts/release_notes.py --flat)

          # Prépendre une nouvelle entrée — ne jamais écraser l'historique
          jq --arg v "$NEW_FULL" --arg chg "$CHANGELOG" --arg ts "$TODAY" \
            '.[0].versions = [{"version":$v,"changelog":$chg,"targetAbi":"10.11.11.0","sourceUrl":"","checksum":"","timestamp":$ts}] + .[0].versions' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json

          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${NEW_FULL}</AssemblyVersion>|" JellyfinCarouselPlugin.csproj
          sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>${NEW_FULL}</FileVersion>|" JellyfinCarouselPlugin.csproj

      - name: Build
        run: |
          dotnet restore JellyfinCarouselPlugin.csproj --configfile nuget.config
          dotnet build JellyfinCarouselPlugin.csproj -c Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: |
          dotnet run --project tests/ScriptTag.Tests -c Release
          cd tests/browser
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node home-rows.test.mjs
          node config-page.test.mjs

      - name: Package ZIP
        run: |
          cd bin/Release/net9.0
          zip -r ../../../JellyfinCarouselPlugin.zip .

      - name: Update manifest sourceUrl + checksum
        run: |
          V=${{ steps.ver.outputs.version }}
          MD5=$(md5sum JellyfinCarouselPlugin.zip | awk '{print $1}')
          URL="https://github.com/peterdu1109/MediaCarousel/releases/download/${V}/JellyfinCarouselPlugin.zip"
          jq --arg url "$URL" --arg md5 "$MD5" '.[0].versions[0].sourceUrl=$url | .[0].versions[0].checksum=$md5' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Commit version bump
        run: |
          git config user.name "peterdu1109"
          git config user.email "peter1109@hotmail.fr"
          git add manifest.json JellyfinCarouselPlugin.csproj
          git diff --cached --quiet || git commit -m "chore: bump ${{ steps.ver.outputs.version }} [skip ci]"
          git push origin main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinCarouselPlugin
          path: JellyfinCarouselPlugin.zip
          retention-days: 30

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${V}$" | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            RAW=$(git log --no-merges --pretty=format:"%s" | grep -v "\[skip ci\]" | head -30)
          else
            RAW=$(git log "${LAST_TAG}..HEAD" --no-merges --pretty=format:"%s" | grep -v "\[skip ci\]")
          fi
          [ -z "$RAW" ] && RAW="Mise a jour et corrections diverses"

          NOTES=$(printf '%s\n' "$RAW" | python3 .github/scripts/release_notes.py)

          # Les notes disent CE QUI CHANGE, et rien d'autre. Le mode d'installation ne
          # change pas d'une version a l'autre : le repeter a chaque release noie les
          # quelques lignes qu'on vient vraiment lire. Il vit dans le README.
          N=/tmp/notes.md
          cat > "$N" <<EOF
# Media Carousel v$V

$NOTES

---

Jellyfin 10.11.11 ou plus recent. Installation et configuration :
[README](https://github.com/peterdu1109/MediaCarousel#readme).
EOF

          gh release delete "$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$V" \
            --title "Media Carousel v${V}" \
            --notes-file "$N" \
            JellyfinCarouselPlugin.zip
